keyring: false

GOOSE_TELEMETRY_ENABLED: false

extensions:
  developer:
    enabled: false

  filesystem:
    enabled: true
    name: filesystem
    type: streamable_http
    uri: http://filesystem-mcp:8000/mcp
    timeout: 300

  dotnet:
    enabled: true
    name: dotnet
    type: streamable_http
    uri: http://dotnet-mcp:8000/mcp
    timeout: 300

  git:
    enabled: true
    name: git
    type: streamable_http
    uri: http://git-mcp:8000/mcp
    timeout: 300
