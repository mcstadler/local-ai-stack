# -------------------------------------------------------
# Network
#
# One network for inter-container-communication ('container_net')
# one between the agent and the reverse proxy ('agent_proxy_net')
# and one for the connection between host and reverse proxy ('host_proxy_net')
# -------------------------------------------------------
networks:
  container_net:
    driver: bridge
    internal: true

  agent_proxy_net:
    driver: bridge
    internal: true

  host_proxy_net:
    driver: bridge

services:

  # -------------------------------------------------------
  # Coding Agent
  # -------------------------------------------------------
  goose:
    build:
      context: ./goose
    networks:
      - container_net
      - agent_proxy_net
    depends_on:
      - ollama
    volumes:
      - ./goose/.config:/root/.config
    environment:
      - GOOSE_PROVIDER=ollama
      - GOOSE_MODEL=qwen3:8b
      - OLLAMA_HOST=http://ollama:11434

  # --------------------------------------------------------
  # LLM server
  # --------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    networks:
      - container_net
    volumes:
      - ./ollama-data:/root/.ollama
      - ${CODE_DIR}:/workspace
    gpus:
      all
    environment:
      - OLLAMA_MODELS=/root/.ollama/models
      - OLLAMA_CONTEXT_LENGTH=8192
    command: ["serve"]

  # --------------------------------------------------------
  # Reverse proxy
  # --------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    networks:
      - agent_proxy_net
      - host_proxy_net
    ports:
      - "127.0.0.1:7681:7681"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - goose
