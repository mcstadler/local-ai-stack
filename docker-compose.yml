networks:
  ai_local_net:
    driver: bridge
    internal: true

  ai_frontend:
    driver: bridge

services:

  # --------------------------------------------------------
  # LLM server
  # --------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    networks:
      - ai_local_net
    volumes:
      - ./ollama-data:/root/.ollama
    gpus:
      all
    environment:
      - OLLAMA_MODELS=/root/.ollama/models
    command: ["serve"]


  # -------------------------------------------------------
  # Chat Frontend
  # -------------------------------------------------------
#  openwebui:
