networks:
  ai_local_net:
    driver: bridge
    internal: true

  ai_frontend:
    driver: bridge

services:

  # -------------------------------------------------------
  # Coding Agent
  # -------------------------------------------------------
  goose:
    build:
      context: ./goose
    networks:
      - ai_local_net
      - ai_frontend
    ports:
      - "7681:7681"
    depends_on:
      - ollama
      - mcp-proxy
#      - filesystem-mcp
#      - git-mcp
#      - dotnet-mcp
    volumes:
      - ./goose/.config:/root/.config
    environment:
#      - GOOSE_PROVIDER=openai
#      - GOOSE_MODEL=qwen2.5-coder:7b
#      - OPENAI_API_KEY=ollama
#      - OPENAI_HOST=http://ollama:11434
#      - OPENAI_BASE_PATH=v1/chat/completions
       - GOOSE_PROVIDER=ollama
       - GOOSE_MODEL=qwen2.5-coder:7b
       - OLLAMA_HOST=http://ollama:11434
       - OLLAMA_CONTEXT_LENGTH=32768

  # --------------------------------------------------------
  # LLM server
  # --------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    networks:
      - ai_local_net
    volumes:
      - ./ollama-data:/root/.ollama
      - ${CODE_DIR}:/workspace
    gpus:
      all
    environment:
      - OLLAMA_MODELS=/root/.ollama/models
    command: ["serve"]

  # -------------------------------------------------------
  # MCP proxy & servers
  # -------------------------------------------------------
  mcp-proxy:
    build:
      context: ./mcp-proxy
    networks:
      - ai_local_net
    ports:
      - "8080:8080"
    volumes:
      - ./mcp-proxy/config:/config
      - ${CODE_DIR}:/workspace

